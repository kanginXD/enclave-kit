---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Reject invalid extra packages
  ansible.builtin.assert:
    that:
      - packages | default([], true) is not string
      - packages | default([], true) | reject("string") | list | length == 0
    fail_msg: packages must be a list of apt package names

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Install extra packages
  ansible.builtin.apt:
    name: "{{ packages | unique }}"
    state: present
  when: packages | default([], true) | length > 0

- name: Enable qemu-guest-agent for next boot
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
