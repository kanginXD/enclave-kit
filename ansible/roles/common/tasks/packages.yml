---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  notify: Rebuild font cache

- name: Enable qemu-guest-agent for next boot
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true

- name: Append input-method environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop: "{{ im_environment }}"
