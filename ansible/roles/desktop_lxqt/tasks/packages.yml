---
- name: Install LXQt and xrdp
  ansible.builtin.apt:
    name: "{{ lxqt_packages + desktop_packages }}"
    state: present
    dpkg_options: force-overwrite
  notify: Rebuild font cache

- name: Append input-method environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop: "{{ im_environment }}"
